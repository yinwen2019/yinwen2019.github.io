---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js profile-document">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="profile-shell">
    <a class="skip-link" href="#page-content">Skip to content</a>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="main" class="profile-shell__body" data-baseurl="{{ site.baseurl }}" data-home="{% if page.url == "/" %}true{% else %}false{% endif %}">
      {% include profile-card.html %}
      <main id="page-content" class="page-viewport" tabindex="-1" aria-label="Page content">
    
      <article class="page{% if page.url == '/' %} page--home{% elsif page.url == '/publications/' %} page--publications{% elsif page.url == '/experience/' %} page--experience{% endif %}" aria-labelledby="page-title" itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            <h1 id="page-title" class="sr-only">{{ page.title | escape }}</h1>
            {{ content }}
          </section>
        </div>
      </article>
      </main>
    </div>
    <p class="sr-only" id="page-status" role="status" aria-live="polite" aria-atomic="true"></p>

    {% include scripts.html %}

  </body>
</html>
